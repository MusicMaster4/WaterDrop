name: Build & Release (Beta)

# Beta channel builds, published from the `testing` branch.
#
# Runs automatically on every push to `testing` (code changes) and can also be
# run by hand from Actions → "Build & Release (Beta)" → Run workflow. Each run
# computes the next beta version, builds the Windows installer, and publishes a
# GitHub *prerelease* carrying a `testing.yml` manifest.
#
# Isolation from the stable channel (see .github/workflows/release.yml):
#   • Beta versions look like  X.Y.Z-testing.N  → electron-builder emits
#     `testing.yml`. The channel is deliberately named "testing" and NOT "beta":
#     electron-updater hardcodes "alpha"/"beta" as cascading channels that also
#     pull stable releases, which would break isolation. "testing" is treated as
#     a fully isolated channel. (See the note in src/main/updater.js.)
#   • The release is marked --prerelease and is NEVER --latest, so it does not
#     replace the stable release on the repo's main page.
#   • Only installs built from this workflow (channel = testing, see updater.js)
#     detect these updates. Stable installs ignore prereleases entirely.
#
# Versioning:
#   • Base X.Y.Z = the next patch above the latest stable release (odometer:
#     patch 0→99 carries into minor, minor 0→9 carries into major), or the
#     numeric part of package.json if it is already higher.
#   • N = beta counter for that base: first beta is -testing.1, then -testing.2,
#     ... A brand-new base restarts the counter at 1.
#   • Manual run with "publish" unchecked → test build (installer artifact only,
#     no release, no tag).
on:
  push:
    branches:
      - testing
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"
      - "docs/**"
  workflow_dispatch:
    inputs:
      bump:
        description: "Base version increment (relative to latest stable)"
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      publish:
        description: "Publish a beta release (uncheck for a test build)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # Resolve the next beta version, tag it, and open a draft prerelease up front
  # so the build job can upload to it.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
      publish: ${{ steps.calc.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need all tags to find the latest version

      - id: calc
        shell: bash
        run: |
          # Defaults make a push event behave like a normal beta release.
          BUMP="${{ inputs.bump }}"
          PUBLISH="${{ inputs.publish }}"
          if [ -z "$BUMP" ]; then BUMP=patch; fi
          if [ -z "$PUBLISH" ]; then PUBLISH=true; fi

          # Numeric part of package.json (drop any prerelease suffix).
          PKG=$(node -p "require('./package.json').version" | sed 's/-.*$//')

          # Latest STABLE release (plain X.Y.Z tags only — beta tags excluded).
          # First build has no tags: grep matches nothing, `|| true` keeps the
          # step alive with LATEST empty.
          LATEST=$(git tag -l 'v*' | sed 's/^v//' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)

          # Rolling odometer bump (mirrors the stable workflow):
          #   • patch 0..99; at 100 it carries into minor and resets to 0
          #   • minor 0..9;  at 10  it carries into major and resets to 0
          #   • major is unbounded
          bump() { # $1=version $2=level
            IFS=. read -r MA MI PA <<< "$1"
            case "$2" in
              major) MA=$((MA+1)); MI=0; PA=0 ;;
              minor) MI=$((MI+1)); PA=0 ;;
              *)     PA=$((PA+1)) ;;
            esac
            if [ "$PA" -gt 99 ]; then PA=0; MI=$((MI+1)); fi
            if [ "$MI" -gt 9 ];  then MI=0; MA=$((MA+1)); fi
            echo "$MA.$MI.$PA"
          }
          gt() { [ "$1" != "$2" ] && \
            [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" = "$1" ]; }

          # Base X.Y.Z the betas iterate toward.
          if [ -z "$LATEST" ]; then
            BASE="$PKG"                       # no stable yet: use package.json
          elif gt "$PKG" "$LATEST"; then
            BASE="$PKG"                        # manual bump in package.json wins
          else
            BASE="$(bump "$LATEST" "$BUMP")"   # next version above latest stable
          fi

          # Highest existing beta counter for this base, then +1.
          LASTN=$(git tag -l "v$BASE-testing.*" | sed "s/^v$BASE-testing\.//" \
            | grep -E '^[0-9]+$' | sort -n | tail -n1 || true)
          if [ -z "$LASTN" ]; then N=1; else N=$((LASTN+1)); fi

          NEW="$BASE-testing.$N"

          echo "version=$NEW"     >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW"        >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Resolved: v$NEW (base: $BASE, latest stable: ${LATEST:-none}, pkg: $PKG, bump: $BUMP, publish: $PUBLISH)"

      - name: Tag version and open draft prerelease
        if: steps.calc.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.calc.outputs.tag }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --prerelease --title "WaterDrop $TAG (beta)" --generate-notes
          fi

  build:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply resolved version
        shell: bash
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Build & publish installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ needs.version.outputs.publish }}" = "true" ]; then
            npx electron-builder --win --publish always
          else
            npx electron-builder --win --publish never
          fi

      - name: Upload installer (test builds)
        if: needs.version.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: waterdrop-windows-beta
          path: |
            release/*.exe
            release/*.yml
          if-no-files-found: ignore

  # Make the draft prerelease public once the build has uploaded. It stays a
  # prerelease and is intentionally NOT marked --latest.
  publish:
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --draft=false --prerelease --latest=false
