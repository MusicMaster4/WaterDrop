name: Build & Release

# Self-versioning Windows builds.
#
# Runs automatically on every push to `main` (code changes), and can also be run
# by hand from Actions → "Build & Release" → Run workflow. Each run computes the
# next version (latest release + 0.0.1 by default), builds the Windows installer,
# and publishes a GitHub Release with auto-update metadata (latest.yml) — no
# manual version edits.
#
#   • bump=patch (default) → 1.0.0 → 1.0.1 → 1.0.2 ... rolling like an odometer:
#       patch fills 0→99, then carries into minor (1.0.99 → 1.1.0); minor fills
#       0→9, then carries into major (1.9.99 → 2.0.0).
#   • bump=minor/major (manual run only) → 1.0.x → 1.1.0 / 2.0.0
#   • Need an exact version? Set it in package.json (higher than the latest
#     release) and it is used as-is for that run.
#   • Manual run with "publish" unchecked → test build (installer artifact only,
#     no release, no bump).
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"
      - "docs/**"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version increment"
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      publish:
        description: "Publish a release (uncheck for a test build)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # Resolve the next version, tag it, and open a draft release up front so the
  # build job can upload to it.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
      publish: ${{ steps.calc.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need all tags to find the latest version

      - id: calc
        shell: bash
        run: |
          # Defaults make a push event behave like a normal patch release.
          BUMP="${{ inputs.bump }}"
          PUBLISH="${{ inputs.publish }}"
          if [ -z "$BUMP" ]; then BUMP=patch; fi
          if [ -z "$PUBLISH" ]; then PUBLISH=true; fi

          PKG=$(node -p "require('./package.json').version")

          # On the first build there are no tags: grep matches nothing and exits
          # 1, which (with pipefail) would kill the step — `|| true` keeps it
          # alive and leaves LATEST empty.
          LATEST=$(git tag -l 'v*' | sed 's/^v//' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)

          # Rolling odometer bump:
          #   • patch goes 0..99; at 100 it carries into minor and resets to 0
          #   • minor goes 0..9;  at 10  it carries into major and resets to 0
          #   • major is unbounded
          bump() { # $1=version $2=level
            IFS=. read -r MA MI PA <<< "$1"
            case "$2" in
              major) MA=$((MA+1)); MI=0; PA=0 ;;
              minor) MI=$((MI+1)); PA=0 ;;
              *)     PA=$((PA+1)) ;;
            esac
            if [ "$PA" -gt 99 ]; then PA=0; MI=$((MI+1)); fi
            if [ "$MI" -gt 9 ];  then MI=0; MA=$((MA+1)); fi
            echo "$MA.$MI.$PA"
          }
          gt() { [ "$1" != "$2" ] && \
            [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" = "$1" ]; }

          if [ -z "$LATEST" ]; then
            NEW="$PKG"                 # first release uses package.json as-is
          elif gt "$PKG" "$LATEST"; then
            NEW="$PKG"                 # manual bump in package.json wins
          else
            NEW="$(bump "$LATEST" "$BUMP")"
          fi

          echo "version=$NEW"     >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW"        >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Resolved: v$NEW (latest tag: ${LATEST:-none}, pkg: $PKG, bump: $BUMP, publish: $PUBLISH)"

      - name: Tag version and open draft release
        if: steps.calc.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.calc.outputs.tag }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --title "WaterDrop $TAG" --generate-notes
          fi

  build:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply resolved version
        shell: bash
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Build & publish installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ needs.version.outputs.publish }}" = "true" ]; then
            npx electron-builder --win --publish always
          else
            npx electron-builder --win --publish never
          fi

      - name: Upload installer (test builds)
        if: needs.version.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: waterdrop-windows
          path: |
            release/*.exe
            release/*.yml
          if-no-files-found: ignore

  # Make the draft release public once the build has uploaded.
  publish:
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --draft=false --latest
