<svg width="960" height="600" viewBox="0 0 960 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WaterDrop interface preview">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0d10"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="dropg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f8fa"/>
      <stop offset="100%" stop-color="#aeb2b8"/>
    </linearGradient>
  </defs>

  <!-- window -->
  <rect x="8" y="8" width="944" height="584" rx="16" fill="url(#win)" stroke="rgba(247,248,250,0.12)"/>
  <!-- titlebar -->
  <g>
    <circle cx="34" cy="34" r="6" fill="#cf7a6b"/>
    <circle cx="54" cy="34" r="6" fill="#c9a86b"/>
    <circle cx="74" cy="34" r="6" fill="#8fb89a"/>
    <text x="470" y="39" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#878b91">WaterDrop</text>
  </g>
  <line x1="8" y1="60" x2="952" y2="60" stroke="rgba(247,248,250,0.08)"/>

  <!-- update banner -->
  <g transform="translate(300,74)">
    <rect width="360" height="46" rx="12" fill="#121215" stroke="rgba(247,248,250,0.24)"/>
    <rect x="12" y="10" width="26" height="26" rx="7" fill="rgba(247,248,250,0.05)" stroke="rgba(247,248,250,0.1)"/>
    <path d="M25 16 l6 8 h-4 v6 h-4 v-6 h-4 z" fill="#f7f8fa"/>
    <text x="50" y="22" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#f7f8fa" font-weight="700">Version 1.0.3 is available</text>
    <text x="50" y="37" font-family="Consolas, monospace" font-size="10.5" fill="#878b91">Your files and settings are kept.</text>
    <rect x="252" y="10" width="94" height="26" rx="8" fill="#f7f8fa"/>
    <text x="299" y="27" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#08080a" font-weight="700">Download</text>
  </g>

  <!-- sidebar -->
  <g transform="translate(24,136)">
    <rect width="300" height="440" rx="14" fill="rgba(247,248,250,0.022)" stroke="rgba(247,248,250,0.08)"/>
    <!-- brand -->
    <g transform="translate(20,24)">
      <rect width="34" height="34" rx="9" fill="url(#dropg)"/>
      <text x="46" y="16" font-family="Arial Black, sans-serif" font-size="16" fill="#f7f8fa" font-weight="900">WaterDrop</text>
      <circle cx="49" cy="27" r="3.5" fill="#8fb89a"/>
      <text x="60" y="31" font-family="Consolas, monospace" font-size="10" fill="#878b91">Serve ready</text>
    </g>
    <!-- url box -->
    <g transform="translate(20,84)">
      <rect width="220" height="36" rx="9" fill="rgba(247,248,250,0.03)" stroke="rgba(247,248,250,0.1)"/>
      <text x="12" y="23" font-family="Consolas, monospace" font-size="11" fill="#d7dade">ts.net/drop</text>
      <rect x="230" y="0" width="36" height="36" rx="9" fill="rgba(247,248,250,0.03)" stroke="rgba(247,248,250,0.1)"/>
    </g>
    <!-- QR -->
    <g transform="translate(20,136)">
      <rect width="246" height="150" rx="12" fill="rgba(247,248,250,0.02)" stroke="rgba(247,248,250,0.08)"/>
      <g transform="translate(87,25)" fill="#d7dade">
        <rect x="0" y="0" width="100" height="100" fill="#0d0d10"/>
        <g fill="#f7f8fa">
          <rect x="8" y="8" width="26" height="26"/><rect x="14" y="14" width="14" height="14" fill="#0d0d10"/>
          <rect x="66" y="8" width="26" height="26"/><rect x="72" y="14" width="14" height="14" fill="#0d0d10"/>
          <rect x="8" y="66" width="26" height="26"/><rect x="14" y="72" width="14" height="14" fill="#0d0d10"/>
          <rect x="44" y="10" width="8" height="8"/><rect x="44" y="26" width="8" height="8"/>
          <rect x="44" y="44" width="8" height="8"/><rect x="60" y="44" width="8" height="8"/>
          <rect x="76" y="60" width="8" height="8"/><rect x="60" y="76" width="8" height="8"/>
          <rect x="44" y="60" width="8" height="8"/><rect x="76" y="76" width="8" height="8"/>
        </g>
      </g>
    </g>
    <!-- settings -->
    <g transform="translate(20,306)">
      <text x="0" y="10" font-family="Consolas, monospace" font-size="10" fill="#595d63">SETTINGS</text>
      <text x="0" y="34" font-family="Segoe UI, sans-serif" font-size="12" fill="#d7dade">Start on login</text>
      <rect x="212" y="24" width="34" height="18" rx="9" fill="rgba(143,184,154,0.3)"/><circle cx="237" cy="33" r="7" fill="#8fb89a"/>
      <text x="0" y="62" font-family="Segoe UI, sans-serif" font-size="12" fill="#d7dade">Close to tray</text>
      <rect x="212" y="52" width="34" height="18" rx="9" fill="rgba(143,184,154,0.3)"/><circle cx="237" cy="61" r="7" fill="#8fb89a"/>
      <line x1="0" y1="86" x2="246" y2="86" stroke="rgba(247,248,250,0.1)"/>
      <text x="0" y="106" font-family="Consolas, monospace" font-size="10" fill="#878b91">v1.0.2</text>
      <rect x="150" y="94" width="96" height="22" rx="7" fill="rgba(247,248,250,0.03)" stroke="rgba(247,248,250,0.1)"/>
      <text x="198" y="109" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#d7dade">Check updates</text>
    </g>
  </g>

  <!-- work area -->
  <g transform="translate(344,136)">
    <!-- head -->
    <text x="0" y="16" font-family="Consolas, monospace" font-size="11" fill="#878b91">3 files · 48.2 MB · next 6d</text>
    <rect x="470" y="0" width="88" height="26" rx="8" fill="#f7f8fa" transform="translate(0,-4)"/>
    <text x="514" y="15" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#08080a" font-weight="700">Upload</text>

    <!-- dropzone -->
    <g transform="translate(0,36)">
      <rect width="588" height="120" rx="14" fill="rgba(247,248,250,0.02)" stroke="rgba(247,248,250,0.18)" stroke-dasharray="6 6"/>
      <g transform="translate(294,44)">
        <path d="M0 -14 l14 16 h-9 v12 h-10 v-12 h-9 z" fill="none" stroke="#aeb2b8" stroke-width="2.5" stroke-linejoin="round"/>
      </g>
      <text x="294" y="78" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#f7f8fa" font-weight="600">Drop files</text>
      <text x="294" y="98" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#878b91">Original bytes, 7 day retention</text>
    </g>

    <!-- file cards -->
    <g transform="translate(0,176)">
      <g>
        <rect width="186" height="230" rx="14" fill="rgba(247,248,250,0.022)" stroke="rgba(247,248,250,0.08)"/>
        <rect x="14" y="14" width="158" height="120" rx="10" fill="#121215"/>
        <path d="M60 60 h66 v44 h-66 z M60 60 l22 26 l14 -14 l30 32" fill="none" stroke="#595d63" stroke-width="2"/>
        <circle cx="112" cy="74" r="7" fill="#595d63"/>
        <text x="14" y="158" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#d7dade">sunset-4k.jpg</text>
        <text x="14" y="178" font-family="Consolas, monospace" font-size="10" fill="#878b91">18.4 MB · 6d · 2</text>
        <rect x="14" y="194" width="90" height="24" rx="7" fill="#f7f8fa"/>
        <text x="59" y="210" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#08080a" font-weight="700">Save</text>
      </g>
      <g transform="translate(201,0)">
        <rect width="186" height="230" rx="14" fill="rgba(247,248,250,0.022)" stroke="rgba(247,248,250,0.08)"/>
        <rect x="14" y="14" width="158" height="120" rx="10" fill="#121215"/>
        <g transform="translate(74,52)" stroke="#595d63" stroke-width="2" fill="none"><rect x="0" y="0" width="34" height="44" rx="3"/><line x1="8" y1="14" x2="26" y2="14"/><line x1="8" y1="24" x2="26" y2="24"/><line x1="8" y1="34" x2="20" y2="34"/></g>
        <text x="14" y="158" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#d7dade">notes.pdf</text>
        <text x="14" y="178" font-family="Consolas, monospace" font-size="10" fill="#878b91">2.1 MB · 6d · 0</text>
        <rect x="14" y="194" width="90" height="24" rx="7" fill="#f7f8fa"/>
        <text x="59" y="210" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#08080a" font-weight="700">Save</text>
      </g>
      <g transform="translate(402,0)">
        <rect width="186" height="230" rx="14" fill="rgba(247,248,250,0.022)" stroke="rgba(247,248,250,0.08)"/>
        <rect x="14" y="14" width="158" height="120" rx="10" fill="#121215"/>
        <g transform="translate(78,50)" stroke="#595d63" stroke-width="2" fill="none"><rect x="0" y="4" width="30" height="40" rx="3"/><path d="M6 4 v-3 h18 v3"/></g>
        <rect x="120" y="122" width="40" height="14" rx="4" fill="rgba(207,122,107,0.15)"/><text x="140" y="132" text-anchor="middle" font-family="Consolas, monospace" font-size="8" fill="#cf7a6b">ZIP</text>
        <text x="14" y="158" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#d7dade">build.zip</text>
        <text x="14" y="178" font-family="Consolas, monospace" font-size="10" fill="#878b91">27.7 MB · 5d · 1</text>
        <rect x="14" y="194" width="90" height="24" rx="7" fill="#f7f8fa"/>
        <text x="59" y="210" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#08080a" font-weight="700">Save</text>
      </g>
    </g>
  </g>
</svg>
