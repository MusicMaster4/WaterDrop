<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WaterDrop">
  <defs>
    <radialGradient id="bgGlow" cx="22%" cy="34%" r="82%">
      <stop offset="0%" stop-color="#17181c"/>
      <stop offset="56%" stop-color="#0d0d10"/>
      <stop offset="100%" stop-color="#07080a"/>
    </radialGradient>
    <radialGradient id="markBg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#16161a"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f8fa"/>
      <stop offset="100%" stop-color="#aeb2b8"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="238" y1="0" x2="720" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="62%" stop-color="#eef0f3"/>
      <stop offset="100%" stop-color="#aeb2b8"/>
    </linearGradient>
    <linearGradient id="route" x1="844" y1="92" x2="1140" y2="300">
      <stop offset="0%" stop-color="#f7f8fa" stop-opacity="0.28"/>
      <stop offset="48%" stop-color="#8fb89a" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#f7f8fa" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.52"/>
    </filter>
    <pattern id="grain" width="140" height="140" patternUnits="userSpaceOnUse">
      <rect width="140" height="140" fill="#ffffff" opacity="0"/>
      <circle cx="19" cy="31" r="0.8" fill="#ffffff" opacity="0.08"/>
      <circle cx="84" cy="58" r="0.7" fill="#ffffff" opacity="0.055"/>
      <circle cx="119" cy="106" r="0.8" fill="#ffffff" opacity="0.06"/>
      <circle cx="42" cy="121" r="0.6" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="380" fill="url(#bgGlow)"/>
  <rect width="1200" height="380" fill="url(#grain)" opacity="0.65"/>
  <path d="M0 76H1200M0 190H1200M0 304H1200" stroke="#f7f8fa" stroke-opacity="0.035"/>
  <path d="M784 57C893 31 1017 67 1125 152" stroke="#f7f8fa" stroke-opacity="0.055" stroke-width="1"/>
  <path d="M830 318C924 260 1026 260 1198 306" stroke="#f7f8fa" stroke-opacity="0.055" stroke-width="1"/>

  <!-- official app logo -->
  <g transform="translate(44 76)" filter="url(#softShadow)">
    <rect x="0" y="0" width="200" height="200" rx="44" fill="url(#markBg)" stroke="rgba(247,248,250,0.14)" stroke-width="1.5"/>
    <path d="M100 40 C100 40 148 96 148 128 A48 48 0 0 1 52 128 C52 96 100 40 100 40 Z"
          fill="url(#drop)" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
    <path d="M84 118 a16 22 0 0 0 6 34" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
    <g stroke="rgba(8,8,10,0.28)" stroke-width="4" stroke-linecap="round">
      <line x1="80" y1="132" x2="120" y2="132"/>
      <line x1="76" y1="146" x2="124" y2="146"/>
    </g>
  </g>

  <g transform="translate(296 104)">
    <text x="0" y="62" font-family="Segoe UI Black, Arial Black, Segoe UI, sans-serif" font-size="82" font-weight="900" fill="url(#wordmark)" letter-spacing="-1">WATERDROP</text>
    <text x="4" y="103" font-family="Cascadia Code, Consolas, monospace" font-size="21" fill="#aeb2b8" letter-spacing="0.4">Private file handoff over your Tailscale network</text>

    <g transform="translate(4 134)" font-family="Cascadia Code, Consolas, monospace" font-size="16" fill="#f7f8fa">
      <g>
        <rect width="121" height="34" rx="17" fill="rgba(247,248,250,0.045)" stroke="rgba(247,248,250,0.14)"/>
        <circle cx="22" cy="17" r="4" fill="#8fb89a"/>
        <text x="38" y="22">Windows</text>
      </g>
      <g transform="translate(135 0)">
        <rect width="134" height="34" rx="17" fill="rgba(247,248,250,0.045)" stroke="rgba(247,248,250,0.14)"/>
        <circle cx="22" cy="17" r="4" fill="#8fb89a"/>
        <text x="38" y="22">QR handoff</text>
      </g>
      <g transform="translate(283 0)">
        <rect width="113" height="34" rx="17" fill="rgba(247,248,250,0.045)" stroke="rgba(247,248,250,0.14)"/>
        <circle cx="22" cy="17" r="4" fill="#8fb89a"/>
        <text x="38" y="22">No cloud</text>
      </g>
    </g>
  </g>

  <g transform="translate(850 92)" opacity="0.88">
    <path d="M32 42C88 18 145 34 190 78C235 122 280 135 335 107" stroke="url(#route)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M46 174C112 206 175 198 226 160C275 124 306 106 354 118" stroke="url(#route)" stroke-width="2.5" stroke-linecap="round" opacity="0.62"/>
    <g fill="#08080a" stroke="#f7f8fa" stroke-opacity="0.24">
      <rect x="0" y="12" width="80" height="58" rx="13" fill="rgba(247,248,250,0.055)"/>
      <rect x="262" y="96" width="80" height="58" rx="13" fill="rgba(247,248,250,0.055)"/>
      <rect x="50" y="200" width="80" height="58" rx="13" fill="rgba(247,248,250,0.045)"/>
    </g>
    <g stroke="#aeb2b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.86">
      <path d="M31 48V33h20l10 10v5"/>
      <path d="M51 33v11h10"/>
      <path d="M31 57h28"/>
      <path d="M293 122h18"/>
      <path d="M302 113v18"/>
      <path d="M87 234v-18"/>
      <path d="M77 224l10 10l10-10"/>
      <path d="M73 240h28"/>
    </g>
    <g fill="#8fb89a">
      <circle cx="32" cy="42" r="4"/>
      <circle cx="310" cy="119" r="4"/>
      <circle cx="88" cy="234" r="4"/>
    </g>
  </g>
